[package]
name = "inkwell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vendor-neutral, open-source desktop printer app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inkwell-core = { path = "../crates/inkwell-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
